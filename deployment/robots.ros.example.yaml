# T12 handoff configuration. Secrets are read from environment variables and
# are never stored in this file. Domain IDs are deployment invariants. This
# shape matches backend/config's RosbridgeConfig contract.
robots:
  - robot_id: robot_1
    name: Pinky Master
    role: MASTER
    namespace: /robot_1
    domain_id: 12
    bridge_url: ws://127.0.0.1:9090
    topics:
      odom: /robot_1/odom
      battery_percent: /robot_1/battery/percent
      battery_voltage: /robot_1/battery/voltage
      camera_compressed: /robot_1/camera/image_raw/compressed
      control_status: /robot_1/control/status
      path: /robot_1/plan
      manual_velocity: /robot_1/control/manual_velocity
      initial_pose: /robot_1/initialpose
      tf: /tf
      tf_static: /tf_static
    services:
      control_command: /robot_1/control/command
      control_command_type: pinky_control_interfaces/srv/ControlCommand
      control_available: false
    camera:
      throttle_rate_ms: 100
      fragment_size: 65536
  - robot_id: robot_2
    name: Pinky Slave
    role: SLAVE
    namespace: /robot_2
    domain_id: 13
    bridge_url: ws://127.0.0.1:9091
    topics:
      odom: /robot_2/odom
      battery_percent: /robot_2/battery/percent
      battery_voltage: /robot_2/battery/voltage
      camera_compressed: /robot_2/camera/image_raw/compressed
      control_status: /robot_2/control/status
      path: /robot_2/plan
      manual_velocity: /robot_2/control/manual_velocity
      initial_pose: /robot_2/initialpose
      tf: /tf
      tf_static: /tf_static
    services:
      control_command: /robot_2/control/command
      control_command_type: pinky_control_interfaces/srv/ControlCommand
      control_available: false
      follow_command: /robot_2/follow/command
      follow_command_type: pinky_control_interfaces/srv/FollowCommand
      follow_available: false
    camera:
      throttle_rate_ms: 100
      fragment_size: 65536
