# Install the built frontend at /opt/pinky-control-platform/frontend/dist and
# replace the certificate paths with host-managed TLS certificates.
server {
    listen 80;
    server_name control.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name control.example.invalid;

    ssl_certificate /etc/pinky-control-center/tls/fullchain.pem;
    ssl_certificate_key /etc/pinky-control-center/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/pinky-control-platform/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
